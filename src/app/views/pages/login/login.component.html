<div [class]="'lp lp--' + scheme()">

  <!-- ── Panel de marca ────────────────────────────────────────────────── -->
  <div class="lp-brand">
    <div class="lp-orb lp-orb--1"></div>
    <div class="lp-orb lp-orb--2"></div>
    <div class="lp-orb lp-orb--3"></div>
    <div class="lp-orb lp-orb--4"></div>

    <div class="lp-brand-inner">

      <!-- Logo: shimmer mientras carga → logo real → isotipo de respaldo -->
      <div class="lp-logo-wrap">
        @if (!publicLoaded()) {
          <div class="lp-logo-shimmer"></div>
        } @else if (logoUrl()) {
          <img [src]="logoUrl()" alt="Logo" class="lp-logo-img" />
        } @else {
          <div class="lp-logo-placeholder">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M14 24C14 18.477 18.477 14 24 14C29.523 14 34 18.477 34 24" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
              <path d="M24 34C18.477 34 14 29.523 14 24" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.55"/>
              <circle cx="24" cy="24" r="4.5" fill="white"/>
            </svg>
          </div>
        }
      </div>

      @if (brandName()) {
        <div class="lp-brand-text">
          <h1 class="lp-brand-name">{{ brandName() }}</h1>
          <p class="lp-brand-tag">Sistema de Gestión Empresarial</p>
        </div>
      }

      <div class="lp-greeting d-none d-lg-block">
        <span class="lp-greeting-text">{{ schemeLabel() }}</span>
      </div>

      <div class="lp-modules d-none d-lg-flex">
        <div class="lp-module">
          <svg cIcon name="cilStorage"   class="lp-module-icon"></svg><span>Inventario</span>
        </div>
        <div class="lp-module">
          <svg cIcon name="cilCart"      class="lp-module-icon"></svg><span>Ventas</span>
        </div>
        <div class="lp-module">
          <svg cIcon name="cilDollar"    class="lp-module-icon"></svg><span>Cobranzas</span>
        </div>
        <div class="lp-module">
          <svg cIcon name="cilChartLine" class="lp-module-icon"></svg><span>Reportes</span>
        </div>
      </div>

    </div>
  </div>

  <!-- ── Panel de formulario ───────────────────────────────────────────── -->
  <div class="lp-form-panel">
    <div class="lp-form-card">

      <div class="lp-form-header">
        <h2 class="lp-form-title">Iniciar sesión</h2>
        <p class="lp-form-subtitle">Ingresa tus credenciales para acceder</p>
      </div>

      @if (error()) {
        <div class="lp-error">
          <svg cIcon name="cilWarning" style="width:16px;height:16px;flex-shrink:0;"></svg>
          <span>{{ error() }}</span>
        </div>
      }

      <form [formGroup]="form" cForm (ngSubmit)="onSubmit()" class="lp-form">

        <div class="lp-field" style="animation-delay:.05s">
          <label class="lp-label" for="lp-email">Correo electrónico</label>
          <div class="lp-input-wrap">
            <svg cIcon name="cilEnvelopeClosed" class="lp-input-icon"></svg>
            <input cFormControl id="lp-email" formControlName="email"
                   type="email" class="lp-input"
                   placeholder="correo@ejemplo.com" autoComplete="email" />
          </div>
        </div>

        <div class="lp-field" style="animation-delay:.1s">
          <label class="lp-label" for="lp-password">Contraseña</label>
          <div class="lp-input-wrap">
            <svg cIcon name="cilLockLocked" class="lp-input-icon"></svg>
            <input cFormControl id="lp-password" formControlName="password"
                   [type]="showPassword() ? 'text' : 'password'"
                   class="lp-input" placeholder="••••••••"
                   autoComplete="current-password" />
            <button type="button" class="lp-eye-btn" (click)="togglePassword()" tabindex="-1">
              <fa-icon [icon]="showPassword() ? 'eye-slash' : 'eye'"></fa-icon>
            </button>
          </div>
        </div>

        <button type="submit" class="lp-submit" style="animation-delay:.15s"
                [disabled]="form.invalid || loading()">
          @if (loading()) {
            <c-spinner size="sm" class="me-2" />Ingresando...
          } @else {
            Ingresar
            <svg cIcon name="cilArrowRight" class="lp-submit-arrow"></svg>
          }
        </button>

      </form>

    </div>
  </div>
</div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

.lp, .lp * { font-family: 'Poppins', sans-serif; }

/* ══ Esquemas de color ════════════════════════════════════════════════════ */
/* Día: celeste con amarillo (cielo de mañana) */
.lp--morning {
  --lp-grad-a: #071428;
  --lp-grad-b: #0d6ab8;
  --lp-grad-c: #f0c020;
  --lp-accent-a: 10,90,160;
  --lp-accent-b: 14,130,210;
}
/* Tarde: naranja con amarillo */
.lp--afternoon {
  --lp-grad-a: #1c0e00;
  --lp-grad-b: #b84000;
  --lp-grad-c: #f09000;
  --lp-accent-a: 184,64,0;
  --lp-accent-b: 224,112,0;
}
/* Noche: azul royal oscuro */
.lp--night {
  --lp-grad-a: #0d1f42;
  --lp-grad-b: #1a3a8f;
  --lp-grad-c: #1e4fc9;
  --lp-accent-a: 26,58,143;
  --lp-accent-b: 30,79,201;
}

/* ══ Layout raíz ══════════════════════════════════════════════════════════ */
.lp {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--cui-body-bg);
}
@media (min-width: 992px) { .lp { flex-direction: row; } }

/* ══ Panel de marca ═══════════════════════════════════════════════════════ */
.lp-brand {
  position: relative;
  overflow: hidden;
  background: linear-gradient(145deg, var(--lp-grad-a) 0%, var(--lp-grad-b) 52%, var(--lp-grad-c) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2.5rem 2rem 9rem;
  /* Sin borde redondeado en mobile — solo el formulario lo tiene */
}
@media (min-width: 992px) {
  .lp-brand {
    flex: 0 0 46%;
    max-width: 46%;
    min-height: 100vh;
    padding: 4rem 3.5rem;
    align-items: flex-start;
  }
}
@media (min-width: 1280px) {
  .lp-brand { padding: 4.5rem 4rem; }
}

/* Orbs */
.lp-orb {
  position: absolute;
  border-radius: 50%;
  background: rgba(255,255,255,.07);
  pointer-events: none;
}
.lp-orb--1 { width:500px; height:500px; top:-200px; right:-160px;  animation: lp-float 9s  ease-in-out infinite; }
.lp-orb--2 { width:300px; height:300px; bottom:-80px; left:-60px;   animation: lp-float 11s ease-in-out infinite reverse; background:rgba(255,255,255,.05); }
.lp-orb--3 { width:140px; height:140px; bottom:120px; right:30px;   animation: lp-float 7s  ease-in-out infinite .8s; background:rgba(255,255,255,.09); }
.lp-orb--4 { width:80px;  height:80px;  top:40%; left:10%;          animation: lp-float 8s  ease-in-out infinite 1.5s reverse; background:rgba(255,255,255,.06); }

@keyframes lp-float {
  0%,100% { transform: translateY(0)     scale(1); }
  50%      { transform: translateY(-24px) scale(1.04); }
}

/* Contenido de marca */
.lp-brand-inner {
  position: relative;
  z-index: 1;
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
  text-align: center;
  width: 100%;
  animation: lp-fade-up .7s ease both;
}
@media (min-width: 992px) {
  .lp-brand-inner { align-items: flex-start; text-align: left; gap: 1.75rem; margin: auto 0; }
}

/* ── Logo ─────────────────────────────────────────────────────────────── */
.lp-logo-shimmer {
  width: 100px; height: 100px;
  border-radius: 22px;
  background: rgba(255,255,255,.12);
  border: 1.5px solid rgba(255,255,255,.2);
  animation: lp-shimmer 1.4s ease-in-out infinite;
}
.lp-logo-img {
  height: 100px;
  max-width: 240px;
  object-fit: contain;
  border: 2px solid rgba(255,255,255,.32);
  border-radius: 18px;
  padding: 8px;
  background: rgba(255,255,255,.09);
  filter: drop-shadow(0 4px 16px rgba(0,0,0,.35));
  animation: lp-pulse 4s ease-in-out infinite;
}
.lp-logo-placeholder {
  width: 100px; height: 100px;
  border-radius: 22px;
  background: rgba(255,255,255,.12);
  border: 1.5px solid rgba(255,255,255,.28);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 32px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.2);
  animation: lp-pulse 4s ease-in-out infinite;
}
.lp-logo-placeholder svg { width: 54px; height: 54px; }

@media (max-width: 991.98px) {
  .lp-logo-shimmer               { width:100px; height:100px; border-radius:24px; }
  .lp-logo-img                   { height:100px; }
  .lp-logo-placeholder           { width:100px; height:100px; border-radius:24px; }
  .lp-logo-placeholder svg       { width:54px; height:54px; }
}

@keyframes lp-shimmer { 0%,100% { opacity:.4; } 50% { opacity:.8; } }
@keyframes lp-pulse   { 0%,100% { transform:scale(1); } 50% { transform:scale(1.04); } }

/* ── Texto de marca ───────────────────────────────────────────────────── */
.lp-brand-name {
  font-size: clamp(1.35rem, 2.8vw, 2rem);
  font-weight: 800;
  letter-spacing: -.025em;
  margin: 0;
  line-height: 1.15;
  text-shadow: 0 2px 20px rgba(0,0,0,.35);
}
.lp-brand-tag {
  font-size: .78rem;
  color: rgba(255,255,255,.6);
  margin: .2rem 0 0;
  letter-spacing: .07em;
  text-transform: uppercase;
  font-weight: 500;
}
.lp-greeting-text {
  font-size: .9rem;
  color: rgba(255,255,255,.55);
  font-style: italic;
}

/* ── Módulos (desktop) ────────────────────────────────────────────────── */
.lp-modules { display: flex; gap: 1.75rem; flex-wrap: wrap; }
.lp-module {
  display: flex; flex-direction: column; align-items: center; gap: .35rem;
  color: rgba(255,255,255,.6);
  font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; font-weight: 600;
  transition: color .2s, transform .2s;
}
.lp-module:hover { color: #fff; transform: translateY(-2px); }
.lp-module-icon  { width: 20px; height: 20px; }

/* ══ Panel formulario ═════════════════════════════════════════════════════ */
.lp-form-panel {
  flex: 1;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  /* Bordes redondeados solo en la parte superior (mobile) */
  border-radius: 2.5rem 2.5rem 0 0;
  margin-top: -4rem;
  position: relative;
  z-index: 1;
  background: var(--cui-body-bg);
  padding: 2.75rem 1.25rem 3rem;
}
@media (min-width: 992px) {
  .lp-form-panel { margin-top: 0; border-radius: 0; align-items: center; padding: 3rem 2.5rem; }
}

.lp-form-card {
  width: 100%;
  max-width: 420px;
  animation: lp-fade-up .6s ease .15s both;
}

/* Encabezado */
.lp-form-header   { margin-bottom: 1.75rem; }
.lp-form-title    { font-size: 1.7rem; font-weight: 800; letter-spacing: -.035em; margin: 0 0 .3rem; color: var(--cui-body-color); }
.lp-form-subtitle { color: var(--cui-secondary-color); font-size: .875rem; margin: 0; }

/* Error */
.lp-error {
  display: flex; align-items: center; gap: .6rem;
  background: rgba(var(--cui-danger-rgb),.09);
  border: 1px solid rgba(var(--cui-danger-rgb),.25);
  color: var(--cui-danger);
  border-radius: .75rem;
  padding: .75rem 1rem;
  font-size: .875rem;
  margin-bottom: 1.25rem;
  animation: lp-shake .35s ease;
}
@keyframes lp-shake { 0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);} }

/* Form */
.lp-form { display: flex; flex-direction: column; gap: 1.1rem; }

.lp-field { display: flex; flex-direction: column; gap: .4rem; animation: lp-fade-up .5s ease both; }
.lp-label { font-size: .8rem; font-weight: 700; color: var(--cui-body-color); letter-spacing: .025em; }

.lp-input-wrap { position: relative; display: flex; align-items: center; }
.lp-input-icon {
  position: absolute; left: .9rem;
  width: 15px; height: 15px;
  color: var(--cui-secondary-color);
  pointer-events: none; flex-shrink: 0;
}
.lp-input {
  width: 100%;
  padding: .78rem 1rem .78rem 2.65rem;
  border: 1.5px solid var(--cui-border-color);
  border-radius: .75rem;
  background: var(--cui-input-bg, var(--cui-body-bg));
  color: var(--cui-body-color);
  font-size: .9375rem;
  transition: border-color .2s, box-shadow .2s;
  outline: none;
}
.lp-input::placeholder { color: var(--cui-secondary-color); opacity: .55; }
.lp-input:-webkit-autofill,
.lp-input:-webkit-autofill:hover,
.lp-input:-webkit-autofill:focus {
  -webkit-box-shadow: 0 0 0 1000px var(--cui-input-bg, var(--cui-body-bg)) inset !important;
  -webkit-text-fill-color: var(--cui-body-color) !important;
  transition: background-color 9999s ease-in-out 0s;
}
.lp-input:focus {
  border-color: rgb(var(--lp-accent-b));
  box-shadow: 0 0 0 3.5px rgba(var(--lp-accent-b), .18);
}
.lp-eye-btn {
  position: absolute; right: .85rem;
  background: none; border: none; padding: .3rem;
  color: var(--cui-secondary-color); cursor: pointer;
  border-radius: .4rem; transition: color .2s; line-height: 1;
}
.lp-eye-btn:hover { color: var(--cui-body-color); }

/* Botón submit */
.lp-submit {
  display: flex; align-items: center; justify-content: center; gap: .5rem;
  width: 100%;
  padding: .88rem 1.5rem;
  margin-top: .4rem;
  background: linear-gradient(135deg, rgb(var(--lp-accent-a)) 0%, rgb(var(--lp-accent-b)) 100%);
  color: #fff;
  border: none;
  border-radius: .75rem;
  font-size: .9375rem; font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 18px -4px rgba(var(--lp-accent-b), .55);
  transition: opacity .2s, transform .15s, box-shadow .2s;
  animation: lp-fade-up .5s ease both;
}
.lp-submit:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 28px -4px rgba(var(--lp-accent-b), .6); }
.lp-submit:active:not(:disabled) { transform: translateY(0); }
.lp-submit:disabled { opacity: .6; cursor: not-allowed; }
.lp-submit-arrow { width: 16px; height: 16px; transition: transform .25s cubic-bezier(.34,1.56,.64,1); }
.lp-submit:hover:not(:disabled) .lp-submit-arrow { transform: translateX(5px); }

/* ══ Animaciones base ═════════════════════════════════════════════════════ */
@keyframes lp-fade-up { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
@media (prefers-reduced-motion: reduce) {
  .lp-brand-inner,.lp-form-card,.lp-field,.lp-submit,.lp-orb { animation:none !important; }
}
</style>
