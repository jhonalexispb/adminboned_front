<div class="modal-header">
  <h5 class="modal-title">{{ title }}</h5>
  <button type="button" class="btn-close" (click)="modal.dismiss()"></button>
</div>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="modal-body">

    @if (error) {
      <div class="alert alert-danger py-2 small mb-3">{{ error }}</div>
    }

    <div class="mb-3">
      <label class="form-label">Nombre <span class="text-danger">*</span></label>
      <input cFormControl formControlName="name" placeholder="Ej. Apurímac" />
      @if (form.get('name')?.invalid && form.get('name')?.touched) {
        <div class="text-danger small mt-1">El nombre es requerido.</div>
      }
    </div>

    <div class="mb-1">
      <label class="form-label">Código <span class="text-body-secondary small">(opcional)</span></label>
      <input cFormControl formControlName="code" placeholder="Ej. 03" maxlength="10" />
    </div>

  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="modal.dismiss()">Cancelar</button>
    <button type="submit" class="btn btn-primary" [disabled]="saving()">
      @if (saving()) { <c-spinner size="sm" class="me-1" /> }
      {{ isEdit ? 'Guardar cambios' : 'Crear departamento' }}
    </button>
  </div>
</form>
