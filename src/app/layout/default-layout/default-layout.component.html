<!--sidebar-->
<c-sidebar
  #sidebar1="cSidebar"
  class="d-print-none sidebar sidebar-fixed border-end"
  colorScheme="dark"
  id="sidebar1"
  visible
>
  <c-sidebar-header class="border-bottom">
    <c-sidebar-brand [routerLink]="[]">
      @if (logoUrl()) {
        <div class="sidebar-brand-full d-flex align-items-center gap-2">
          <img [src]="logoUrl()!" alt="Logo" class="rounded-2 border flex-shrink-0" height="32" style="width:auto; max-width:60px; object-fit:contain;" />
          @if (brandName()) {
            <span class="text-truncate fw-semibold">{{ brandName() }}</span>
          }
        </div>
        <img [src]="logoUrl()!" alt="Logo" class="sidebar-brand-narrow rounded-2 border" height="32" width="32" style="object-fit:cover;" />
      } @else if (brandName()) {
        <span class="sidebar-brand-full text-truncate fw-semibold">{{ brandName() }}</span>
        <span class="sidebar-brand-narrow fw-semibold">{{ brandName()![0].toUpperCase() }}</span>
      } @else {
        <svg [class]="{icon: false}" cIcon class="sidebar-brand-full" height="32" name="logo" title="CoreUI Logo"></svg>
        <svg cIcon class="sidebar-brand-narrow" height="32" name="signet" title="CoreUI Logo"></svg>
      }
    </c-sidebar-brand>
  </c-sidebar-header>

  <ng-scrollbar pointerEventsMethod="scrollbar" visibility="hover">
    <c-sidebar-nav [navItems]="navItems()" dropdownMode="close" />
  </ng-scrollbar>

  @if (!sidebar1.narrow) {
    <c-sidebar-footer cSidebarToggle="sidebar1" class="border-top d-none d-lg-flex" toggle="unfoldable" style="cursor: pointer;">
      <button cSidebarToggler aria-label="Toggle sidebar fold"></button>
    </c-sidebar-footer>
  }
</c-sidebar>

<!--main-->
<div class="wrapper d-flex flex-column min-vh-100">
  <!--app-header-->
  <app-default-header
    [cShadowOnScroll]="'sm'"
    class="mb-4 d-print-none header header-sticky p-0 shadow-sm"
    position="sticky"
    sidebarId="sidebar1"
  />
  <!--app-body-->
  <div class="body flex-grow-1 mb-5">
    <c-container breakpoint="lg" class="h-auto px-4">
      <router-outlet />
    </c-container>
  </div>

</div>

<!-- Registrar depósito (acceso rápido desde la deuda en el header) -->
<app-register-deposit-modal
  [open]="collectionService.showNewDeposit()"
  [deposit]="null"
  (registered)="onDepositRegistered($event)"
  (cancelled)="collectionService.showNewDeposit.set(false)" />

<!-- Registrar depósito de vuelto de viáticos (acceso rápido desde el header) -->
<app-register-deposit-modal
  source="viatico"
  [open]="viaticoReturnService.showNewDeposit()"
  [deposit]="null"
  (registered)="onViaticoDepositRegistered($event)"
  (cancelled)="viaticoReturnService.showNewDeposit.set(false)" />

<!-- Notificaciones (acceso rápido desde la campana en el header) -->
<app-notifications-modal />
