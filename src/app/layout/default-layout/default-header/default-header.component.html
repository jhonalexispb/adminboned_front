<ng-container>
  <c-container [fluid]="true" class="border-bottom px-2 px-sm-4">

    <!-- Sidebar toggle -->
    <button [cSidebarToggle]="sidebarId()" cHeaderToggler class="btn"
            toggle="visible" style="margin-inline-start: -14px;" aria-label="Abrir/cerrar sidebar">
      <svg cIcon name="cilMenu" size="lg"></svg>
    </button>

    <!-- Deuda pendiente con la empresa -->
    @if (debt() > 0) {
      <div class="d-flex align-items-center gap-1 gap-sm-2 ms-1 ms-sm-2 flex-shrink-0">
        <a routerLink="/payments/my-collections" class="text-decoration-none"
           title="Tienes una deuda pendiente con la empresa">
          <c-badge color="danger" shape="rounded-pill" class="d-flex align-items-center gap-1 px-2 py-1 text-nowrap">
            <svg cIcon name="cilWallet" size="sm"></svg>
            <span class="fw-semibold"><span class="d-none d-sm-inline">Debes </span>S/ {{ debt() | number:'1.2-2' }}</span>
          </c-badge>
        </a>
        <button cButton color="success" variant="outline" size="sm"
                class="d-flex align-items-center py-1 px-2"
                title="Registrar depósito"
                (click)="openNewDeposit()">
          <svg cIcon name="cilInstitution" size="sm"></svg>
        </button>
      </div>
    }

    <!-- Acciones lado derecho -->
    <c-header-nav class="ms-auto">

      <!-- Campana de notificaciones -->
      <ng-container *ngTemplateOutlet="notificationsDropdown" />

      <!-- Separador -->
      <div class="nav-item py-1">
        <div class="vr h-100 mx-1 mx-sm-2 text-body text-opacity-75"></div>
      </div>

      <!-- Tema -->
      <ng-container *ngTemplateOutlet="themeDropdown" />

      <!-- Separador -->
      <div class="nav-item py-1">
        <div class="vr h-100 mx-1 mx-sm-2 text-body text-opacity-75"></div>
      </div>

      <!-- Usuario -->
      <ng-container *ngTemplateOutlet="userDropdown" />

    </c-header-nav>
  </c-container>

  <!-- Breadcrumb -->
  <c-container [fluid]="true" class="px-4">
    <c-breadcrumb-router />
  </c-container>
</ng-container>

<!-- ── Notificaciones ──────────────────────────────────────────────────── -->
<ng-template #notificationsDropdown>
  <div class="nav-item d-flex align-items-center">
    <button class="nav-link py-0 px-2 position-relative border-0 bg-transparent"
            (click)="alertsService.notificationsOpen.set(true)"
            aria-label="Notificaciones">
      <svg cIcon name="cilBell" size="lg"></svg>
      @if (alerts().total > 0) {
        <c-badge color="danger" shape="rounded-pill"
                 class="position-absolute top-0 start-75 translate-middle p-1"
                 style="font-size:0.6rem">
          {{ alerts().total > 9 ? '9+' : alerts().total }}
        </c-badge>
      }
    </button>
  </div>
</ng-template>

<!-- ── Tema ────────────────────────────────────────────────────────────── -->
<ng-template #themeDropdown>
  <c-dropdown alignment="end" variant="nav-item">
    <button [caret]="false" cDropdownToggle aria-label="Cambiar tema">
      <svg cIcon [name]="themeIcon()" size="lg"></svg>
    </button>
    <div cDropdownMenu>
      @for (mode of colorModes; track mode.name) {
        <button cDropdownItem (click)="colorMode.set(mode.name)"
                [active]="colorMode() === mode.name"
                class="d-flex align-items-center">
          <svg cIcon class="me-2" [name]="mode.icon" size="lg"></svg>
          {{ mode.text }}
        </button>
      }
    </div>
  </c-dropdown>
</ng-template>

<!-- ── Usuario ─────────────────────────────────────────────────────────── -->
<ng-template #userDropdown>
  <c-dropdown alignment="end" variant="nav-item">
    <button [caret]="false" cDropdownToggle class="py-0 pe-0"
            aria-label="Menú de usuario">
      <div class="d-flex align-items-center gap-2 px-1">
        <div class="d-flex flex-column align-items-end d-none d-md-flex">
          <span class="small fw-semibold lh-1">{{ auth.user()?.name }}</span>
          <span class="text-muted" style="font-size:0.7rem">{{ auth.user()?.roles?.[0] ?? 'usuario' }}</span>
        </div>
        <div class="rounded-circle bg-primary d-flex align-items-center justify-content-center text-white fw-bold"
             style="width:34px;height:34px;font-size:0.85rem">
          {{ (auth.user()?.name ?? 'U')[0].toUpperCase() }}
        </div>
      </div>
    </button>

    <ul cDropdownMenu class="pt-0" style="min-width:200px">
      <li>
        <div class="bg-body-secondary px-3 py-2 rounded-top">
          <div class="fw-semibold small">{{ auth.user()?.name }}</div>
          <div class="text-muted" style="font-size:0.75rem">{{ auth.user()?.email }}</div>
        </div>
      </li>
      <li><hr cDropdownDivider /></li>
      <li>
        <a cDropdownItem routerLink="/settings/empresa" class="d-flex align-items-center gap-2">
          <svg cIcon name="cilSettings" size="sm"></svg>
          Mi Empresa
        </a>
      </li>
      <li><hr cDropdownDivider /></li>
      <li>
        <button cDropdownItem (click)="logout()"
                class="d-flex align-items-center gap-2 text-danger">
          <svg cIcon name="cilAccountLogout" size="sm"></svg>
          Cerrar sesión
        </button>
      </li>
    </ul>
  </c-dropdown>
</ng-template>
